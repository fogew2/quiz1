<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أداء الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --text:#16231F; --muted:#5B6B66; --line:#E1E7E3;
  --primary:#1C4B4B; --accent:#E8A33D;
  --c-collab:#3E8F6B; --c-initiator:#D65A45; --c-organized:#3D6FA8; --c-adaptive:#8B5FBF; --c-competitive:#D6A72D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101815; --surface:#182420; --text:#EAF1EC; --muted:#93A79E; --line:#28352F;
    --primary:#5FB4A8; --accent:#F0B65B;
  }
}
:root[data-theme="dark"]{
  --bg:#101815; --surface:#182420; --text:#EAF1EC; --muted:#93A79E; --line:#28352F;
  --primary:#5FB4A8; --accent:#F0B65B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:'Tajawal',system-ui,sans-serif; display:flex; justify-content:center;}
h1,h2,h3,.brand{font-family:'Almarai',system-ui,sans-serif;}
.wrap{width:100%; max-width:560px; padding:28px 20px 40px;}
header{text-align:center; margin-bottom:22px;}
.brand{font-size:1.05rem; color:var(--primary); font-weight:800;}
h1{font-size:1.55rem; margin:6px 0 4px; font-weight:800;}
.sub{color:var(--muted); font-size:.92rem; margin:2px 0;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:24px 20px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
.progress-track{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:20px;}
.progress-fill{height:100%; background:var(--primary); border-radius:99px; transition:width .35s ease;}
.qnum{color:var(--muted); font-size:.82rem; margin-bottom:6px;}
.qtitle{color:var(--accent); font-weight:800; font-size:.9rem; margin:0 0 6px;}
.qtext{font-size:1.1rem; line-height:1.6; margin:0 0 18px; font-weight:700;}
.intro-text{font-size:1.02rem; line-height:1.8; margin:0 0 4px; font-weight:500;}
.media{border-radius:14px; overflow:hidden; margin-bottom:16px;}
.media img{width:100%; display:block;}
.media.icon-box{background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px 0; color:var(--primary);}
.media.icon-box svg{width:52px; height:52px;}
.options{display:flex; flex-direction:column; gap:10px;}
.opt{text-align:right; background:var(--bg); border:1.5px solid var(--line); color:var(--text); border-radius:12px; padding:14px 16px; font-size:.96rem; font-family:inherit; cursor:pointer; transition:border-color .15s, background .15s; line-height:1.5; display:flex; gap:10px; align-items:flex-start;}
.opt .letter{font-weight:800; color:var(--primary); flex-shrink:0;}
.opt:hover{border-color:var(--primary);}
.opt:active{background:var(--line);}
#start-btn, .restart{display:block; width:100%; margin-top:22px; padding:14px; border:none; border-radius:12px; background:var(--primary); color:#fff; font-family:'Tajawal',sans-serif; font-weight:700; font-size:1rem; cursor:pointer;}
.hidden{display:none !important;}
.result-badge{display:inline-block; padding:5px 14px; border-radius:99px; color:#fff; font-weight:700; font-size:.85rem; margin-bottom:10px;}
.result-title{font-size:1.4rem; font-weight:800; margin:0 0 8px;}
.result-desc{color:var(--muted); line-height:1.7; margin:0 0 22px; font-size:.95rem;}
.bars{display:flex; flex-direction:column; gap:14px; margin-bottom:24px;}
.bar-row .bar-label{display:flex; justify-content:space-between; font-size:.85rem; margin-bottom:5px; font-weight:700;}
.bar-track{height:10px; background:var(--line); border-radius:99px; overflow:hidden;}
.bar-fill{height:100%; border-radius:99px; transition:width .6s ease;}
.discuss{border-top:1px solid var(--line); padding-top:18px;}
.discuss h3{font-size:1rem; margin:0 0 8px;}
.discuss p{color:var(--muted); font-size:.92rem; line-height:1.7; margin:0;}
</style>
</head>

let current=0; const scores={collab:0,initiator:0,organized:0,adaptive:0,competitive:0};
const letters=["أ","ب","ج","د","هـ"];

const introView=document.getElementById('intro-view');
const quizView=document.getElementById('quiz-view');
const resultView=document.getElementById('result-view');

document.getElementById('start-btn').onclick=()=>{
  introView.classList.add('hidden'); quizView.classList.remove('hidden'); renderQ();
};
document.getElementById('restart-btn').onclick=()=>{
  current=0; for(const k in scores) scores[k]=0;
  resultView.classList.add('hidden'); introView.classList.remove('hidden');
};

function renderQ(){
  const q=QUESTIONS[current];
  document.getElementById('qnum').textContent=`موقف ${current+1} من ${QUESTIONS.length}`;
  document.getElementById('progress-fill').style.width=`${(current/QUESTIONS.length)*100}%`;
  document.getElementById('qtitle').textContent=q.title;
  document.getElementById('qtext').textContent=q.text;

  const mediaEl=document.getElementById('qmedia');
  if(q.media.type==='photo'){
    mediaEl.innerHTML=`<div class="media"><img src="${PHOTOS[q.media.src]}" alt=""></div>`;
  } else {
    mediaEl.innerHTML=`<div class="media icon-box">${ICONS[q.media.src]}</div>`;
  }

  const optsEl=document.getElementById('options'); optsEl.innerHTML='';
  q.opts.forEach(([label,style],idx)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="letter">${letters[idx]}.</span><span>${label}</span>`;
    b.onclick=()=>{ scores[style]++; current++; current<QUESTIONS.length?renderQ():showResult(); };
    optsEl.appendChild(b);
  });
}

function showResult(){
  quizView.classList.add('hidden'); resultView.classList.remove('hidden');
  const total=QUESTIONS.length;
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const topKey=sorted[0][0]; const top=STYLES[topKey];

  document.getElementById('result-badge').textContent='نمط فريقكم الغالب';
  document.getElementById('result-badge').style.background=top.color;
  document.getElementById('result-title').textContent=top.name;
  document.getElementById('result-title').style.color=top.color;
  document.getElementById('result-desc').textContent=top.desc;

  const barsEl=document.getElementById('bars'); barsEl.innerHTML='';
  sorted.forEach(([key,val])=>{
    const pct=Math.round((val/total)*100);
    const s=STYLES[key];
    const row=document.createElement('div'); row.className='bar-row';
    row.innerHTML=`<div class="bar-label"><span>${s.name}</span><span>${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${s.color}"></div></div>`;
    barsEl.appendChild(row);
  });
}
</script>
